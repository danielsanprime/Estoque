<script>

const firebaseConfig = {

apiKey:
"AIzaSyAsrL3eJLWArVegBk4NqrL8m5DsdoA6f1Q",

authDomain:
"estoque-daniel-san.firebaseapp.com",

projectId:
"estoque-daniel-san",

storageBucket:
"estoque-daniel-san.firebasestorage.app",

messagingSenderId:
"355146085358",

appId:
"1:355146085358:web:d20d238a253df446aa14ff",

measurementId:
"G-SDJNVX4FFN"

};

if(
!firebase.apps.length
){

firebase.initializeApp(
firebaseConfig
);

}

const db =
firebase.firestore();

// ======================
// TOAST

function showToast(
msg
){

toast.innerText =
msg;

toast.classList.add(
'show'
);

setTimeout(()=>{

toast.classList.remove(
'show'
);

},2200);

}

// ======================
// TROCAR TELA

function trocarTela(
nome
){

document
.querySelectorAll(
'.page'
)
.forEach(
p=>

p.classList.remove(
'active'
)

);

document
.querySelectorAll(
'.nav-btn'
)
.forEach(
b=>

b.classList.remove(
'active'
)

);

document
.getElementById(
nome +
'Page'
)
.classList.add(
'active'
);

event.currentTarget
.classList.add(
'active'
);

}

// ======================
// CARREGAR PRODUTOS

async function carregarProdutos(){

const snap =

await db
.collection(
'estoque'
)
.get();

produtos =
[];

snap.forEach(doc=>{

const dados =
doc.data()
||
{};

produtos.push({

id:
doc.id,

nome:
doc.id,

estoque:
dados.qtd
||
0

});

});

renderProdutos();

renderEntradaEstoque();

renderPedidos();

}

// ======================

// ======================
// RENDER PRODUTOS

function renderProdutos(){

const busca =

document
.getElementById(
'buscar'
)
.value
.toLowerCase()
.trim();

listaProdutos.innerHTML =
'';

produtos
.filter(p=>

p.nome
.toLowerCase()
.includes(
busca
)

)
.forEach(prod=>{

const atual =

carrinho[
prod.nome
]
||
0;

const div =
document.createElement(
'div'
);

div.className =
'prod-card';

div.innerHTML =

`
<div
class="
prod-top
"
>

<div
class="
prod-info
"
>

<div
class="
prod-nome
"
>
${prod.nome}
</div>

<div
class="
prod-estoque
"
>

Estoque:
${prod.estoque}

</div>

</div>

<div
class="
prod-badge
"
>

${atual}
 selecionado

</div>

</div>

<div
class="
controls
"
>

<button
class="
control-btn
btn-minus
"
onclick="
menos(
'${prod.nome}'
)
"
>
−
</button>

<div
class="
control-number
"
>
${atual}
</div>

<button
class="
control-btn
btn-plus
"
onclick="
mais(
'${prod.nome}'
)
"
>
+
</button>

</div>
`;

listaProdutos
.appendChild(
div
);

});

}

// ======================
// MAIS

function mais(
nome
){

if(
!carrinho[
nome
]
){

carrinho[
nome
]
=
0;

}

carrinho[
nome
]++;

renderProdutos();

}

// ======================
// MENOS

function menos(
nome
){

if(
!carrinho[
nome
]
){
return;
}

carrinho[
nome
]--;

if(
carrinho[
nome
]
<=
0
){

delete carrinho[
nome
];

}

renderProdutos();

}

// ======================
// BUSCA

buscar
.addEventListener(
'input',
renderProdutos
);

// ======================
// ENVIAR BAIXA

async function enviarBaixa(){

const itens =
Object.entries(
carrinho
);

if(
itens.length
===
0
){

showToast(
'Nenhum item selecionado'
);

return;

}

try{

for(
const
[
nome,
qtd
]
of itens
){

const produto =
produtos.find(
p=>
p.nome
===
nome
);

if(
!produto
){
continue;
}

const novoEstoque =

Math.max(
0,
produto.estoque
-
qtd
);

await db
.collection(
'estoque'
)
.doc(
produto.id
)
.update({

qtd:
novoEstoque

});

produto.estoque =
novoEstoque;

}

showToast(
'Baixa enviada ✅'
);

carrinho =
{};

renderProdutos();

renderPedidos();

}catch(e){

console.log(
e
);

showToast(
'Erro salvar'
);

}

}

// ======================
// TELA ESTOQUE

function renderEntradaEstoque(){

entradaEstoque.innerHTML =
'';

produtos.forEach(
prod=>{

const div =
document.createElement(
'div'
);

div.className =
'prod-card';

div.innerHTML =

`
<div
class="
prod-top
"
>

<div
class="
prod-info
"
>

<div
class="
prod-nome
"
>
${prod.nome}
</div>

<div
class="
prod-estoque
"
>

Atual:
${prod.estoque}

</div>

</div>

<div
class="
prod-badge
"
>

ENTRADA

</div>

</div>

<div
class="
controls
"
>

<button
class="
control-btn
btn-minus
"
onclick="
entradaMenos(
'${prod.nome}'
)
"
>
−
</button>

<div
class="
control-number
"
id="
estoque_${prod.nome}
"
>
0
</div>

<button
class="
control-btn
btn-plus
"
onclick="
entradaMais(
'${prod.nome}'
)
"
>
+
</button>

</div>
`;

entradaEstoque
.appendChild(
div
);

}
);

}

let entrada =
{};

function entradaMais(
nome
){

entrada[
nome
] =
(
entrada[
nome
]
||
0
)
+
1;

document
.getElementById(
'estoque_' +
nome
)
.innerText =

entrada[
nome
];

}

function entradaMenos(
nome
){

if(
!entrada[
nome
]
){
return;
}

entrada[
nome
]--;

document
.getElementById(
'estoque_' +
nome
)
.innerText =

entrada[
nome
];

}

// ======================
// SALVAR ENTRADA ESTOQUE

async function salvarEntradaEstoque(){

const itens =
Object.entries(
entrada
)
.filter(
([_,qtd])=>
qtd > 0
);

if(
itens.length
===
0
){

showToast(
'Nenhuma entrada'
);

return;

}

try{

for(
const
[
nome,
qtd
]
of itens
){

const produto =
produtos.find(
p=>
p.nome
===
nome
);

if(
!produto
){
continue;
}

const novoEstoque =

produto.estoque
+
qtd;

await db
.collection(
'estoque'
)
.doc(
produto.id
)
.update({

qtd:
novoEstoque

});

produto.estoque =
novoEstoque;

}

entrada =
{};

renderProdutos();

renderEntradaEstoque();

renderPedidos();

showToast(
'Estoque atualizado ✅'
);

}catch(e){

console.log(
e
);

showToast(
'Erro estoque'
);

}

}

function enviarPedidoWhatsapp(){

const faltando =

produtos.filter(
p=>

(
p.estoque
||
0
)
<
5
);

if(
faltando.length
===
0
){

showToast(
'Sem pedido'
);

return;

}

let texto =

'🍣 *PEDIDO ESTOQUE DANIEL SAN*%0A%0A';

faltando.forEach(
p=>{

texto +=

'• '

+

p.nome

+

' (estoque: '

+

p.estoque

+

')%0A';

}
);

window.open(

'https://wa.me/?text='
+
texto,

'_blank'

);

}

// ======================

function renderCMV(){

cmvBox.innerHTML =

`
<div
class="
